<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Grisen">
<title>Grisens spel</title>
<style>
  :root {
    --bg: #fdf3e1;
    --text: #5a3b2e;
    --accent: #ff8fb1;
    --accent-dark: #c4577b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: "Comic Sans MS", "Chalkboard SE", "Comic Neue", system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  .pig { position: relative; font-size: clamp(80px, 18vw, 130px); line-height: 1; animation: bob 1.6s ease-in-out infinite; }
  #pigHat { position: absolute; left: 50%; top: -0.32em; font-size: 0.5em; transform: translateX(-50%) rotate(-12deg); }
  #hats { margin: -14px 0 22px; }
  @keyframes bob {
    0%, 100% { transform: translateY(0) rotate(-4deg); }
    50% { transform: translateY(-10px) rotate(4deg); }
  }
  h1 { margin: 8px 0 4px; font-size: clamp(30px, 6vw, 48px); text-align: center; }
  .sub { margin: 0 0 28px; font-size: clamp(18px, 3vw, 24px); }
  #games {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 20px;
    width: 100%;
    max-width: 760px;
  }
  .game {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    padding: 24px 16px;
    border-radius: 24px;
    background: #fff;
    color: var(--text);
    text-decoration: none;
    box-shadow: 0 6px 0 var(--accent-dark), 0 10px 24px #0002;
    border: 4px solid var(--accent);
    transition: transform 0.15s;
  }
  .game:hover, .game:focus-visible { transform: translateY(-4px) rotate(-1deg); outline: none; }
  .game:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--accent-dark); }
  .game .icon { font-size: 72px; line-height: 1.1; }
  .game .name { font-size: 28px; font-weight: bold; }
  .game .about { font-size: 18px; text-align: center; opacity: 0.8; }
  .game.soon { box-shadow: none; border: 4px dashed #d8c6b4; background: transparent; opacity: 0.7; }
  .game.soon:hover { transform: none; }
</style>
</head>
<body>
  <div class="pig"><span id="pigHat"></span>🐷</div>
  <h1>Grisens spel</h1>
  <p class="sub">Välj ett spel!</p>
  <div id="hats"></div>
  <div id="games"></div>

<script src="piggy.js"></script>
<script>
// ---- The games. To add one: make a new page (like maze.html) and add it here. ----
const GAMES = [
  { page: 'maze.html', icon: '🍌', name: 'Bananlabyrinten', about: 'Hitta alla bananer i den mörka labyrinten' },
  { page: 'quest.html', icon: '🎒', name: 'Gårdsäventyret', about: 'Hitta saker, sätt ihop dem och hjälp mormor' },
  { page: 'fly.html', icon: '✈️', name: 'Flygturen', about: 'Flyg planet och plocka bananer utan att krocka' },
];

// The pig wears its hat here too, and the hat shop can be opened from the start page
const showHat = h => { document.getElementById('pigHat').textContent = h || ''; };
showHat(Piggy.hat());
Piggy.onHatChange(showHat);
Piggy.mount(document.getElementById('hats'));

const box = document.getElementById('games');
for (const g of GAMES) {
  const a = document.createElement('a');
  a.className = 'game';
  a.href = g.page;
  a.innerHTML = `<span class="icon">${g.icon}</span><span class="name">${g.name}</span><span class="about">${g.about}</span>`;
  box.appendChild(a);
}
const soon = document.createElement('div');
soon.className = 'game soon';
soon.innerHTML = '<span class="icon">🎁</span><span class="name">Fler kommer snart!</span>';
box.appendChild(soon);

// Arrow keys move between the games, Enter starts one
addEventListener('keydown', e => {
  const links = [...box.querySelectorAll('a.game')];
  const i = links.indexOf(document.activeElement);
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') links[(i + 1) % links.length].focus();
  else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') links[(i - 1 + links.length) % links.length].focus();
  else return;
  e.preventDefault();
});
box.querySelector('a.game').focus();
</script>
</body>
</html>
